<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상일초 5-2 랜덤 발표자 뽑기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; background: #f4f7fb; color: #1e2433; }
  header { text-align: center; padding: 28px 16px 4px; }
  h1 { margin: 0; font-size: 2.2rem; }
  .desc { color: #5b6577; margin: 8px 0 0; font-size: 1.05rem; }
  .stage { display: flex; justify-content: center; align-items: center; gap: 28px; flex-wrap: wrap; padding: 20px 16px 8px; }
  .result { width: 210px; height: 210px; border-radius: 36px; background: #fff; box-shadow: 0 12px 30px rgba(30, 36, 51, .12); display: grid; place-items: center; font-size: 6rem; font-weight: 800; color: #1c7ed6; }
  .result.done { animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .buttons { display: flex; flex-direction: column; gap: 12px; }
  button { font: inherit; font-size: 1.3rem; font-weight: 700; border: 0; border-radius: 16px; padding: 16px 30px; cursor: pointer; }
  #drawBtn { background: #1c7ed6; color: #fff; }
  #drawBtn:disabled, #resetBtn:disabled { opacity: .45; cursor: not-allowed; }
  #resetBtn { background: #e3e9f1; color: #1e2433; }
  .info { text-align: center; color: #5b6577; font-size: 1.1rem; margin: 8px 0 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 10px; max-width: 760px; margin: 16px auto 40px; padding: 0 16px; }
  .card { aspect-ratio: 1; border-radius: 14px; background: #fff; border: 2px solid #d6e2f0; display: grid; place-items: center; font-size: 1.6rem; font-weight: 700; transition: transform .12s, background .12s; }
  .card.flash { background: #ffe566; border-color: #f59f00; transform: scale(1.08); }
  .card.now { background: #1c7ed6; color: #fff; border-color: #1c7ed6; }
  .card.picked { background: #dfe3e8; color: #9aa3ae; border-color: #dfe3e8; }
</style>
</head>
<body>
<header>
  <h1>🎤 상일초 5-2 랜덤 발표자 뽑기</h1>
  <p class="desc">뽑힌 번호는 회색으로 바뀌고 다시 뽑히지 않아요.</p>
</header>

<section class="stage">
  <div class="result" id="result">?</div>
  <div class="buttons">
    <button id="drawBtn">뽑기!</button>
    <button id="resetBtn">처음부터</button>
  </div>
</section>
<p class="info" id="info">남은 학생: 25명</p>
<div class="grid" id="grid"></div>

<script>
  const TOTAL = 17; // 우리 반 학생 수 (바꿔서 쓰세요)

  const grid = document.getElementById('grid');
  const result = document.getElementById('result');
  const info = document.getElementById('info');
  const drawBtn = document.getElementById('drawBtn');
  const resetBtn = document.getElementById('resetBtn');
  let picked = [];

  // 1~TOTAL 번호 카드를 만들어요
  function makeCards() {
    grid.innerHTML = '';
    for (let n = 1; n <= TOTAL; n++) {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = 'card-' + n;
      card.textContent = n;
      grid.appendChild(card);
    }
  }

  // 아직 뽑히지 않은 번호 목록
  function remaining() {
    const list = [];
    for (let n = 1; n <= TOTAL; n++) {
      if (!picked.includes(n)) list.push(n);
    }
    return list;
  }

  function updateInfo() {
    const left = remaining().length;
    info.textContent = left > 0 ? '남은 학생: ' + left + '명' : '모두 발표했어요! 👏';
    drawBtn.disabled = left === 0;
    resetBtn.disabled = false;
  }

  // 카드가 섞이다가 한 명이 크게 표시돼요
  function draw() {
    const pool = remaining();
    if (pool.length === 0) return;
    drawBtn.disabled = true;
    resetBtn.disabled = true;
    document.querySelectorAll('.card.now').forEach(c => c.classList.replace('now', 'picked'));

    const winner = pool[Math.floor(Math.random() * pool.length)];
    const steps = 18;
    let step = 0;
    const timer = setInterval(() => {
      document.querySelectorAll('.card.flash').forEach(c => c.classList.remove('flash'));
      step++;
      const n = step < steps ? pool[Math.floor(Math.random() * pool.length)] : winner;
      document.getElementById('card-' + n).classList.add('flash');
      result.textContent = n;

      if (step === steps) {
        clearInterval(timer);
        const card = document.getElementById('card-' + winner);
        card.classList.remove('flash');
        card.classList.add('now');
        picked.push(winner);
        result.classList.remove('done');
        void result.offsetWidth; // 애니메이션 다시 시작
        result.classList.add('done');
        updateInfo();
      }
    }, 80);
  }

  function reset() {
    picked = [];
    result.textContent = '?';
    makeCards();
    updateInfo();
  }

  drawBtn.addEventListener('click', draw);
  resetBtn.addEventListener('click', reset);
  reset();
</script>
</body>
</html>
